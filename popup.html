<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AIAssist Suite</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>AIAssist+</h2>
      <small id="status">Demo Mode: off</small>
    </div>

    <label>Persona</label>
    <select id="personaSelect"><option value="">(default)</option></select>

    <label>Operation</label>
    <select id="operation">
      <option value="summarize">Summarize page/article</option>
      <option value="writer">Generate / Writer</option>
      <option value="rewrite">Rewrite selection</option>
      <option value="translate">Translate selection</option>
      <option value="proofread">Proofread selection</option>
    </select>

    <label>Prompt / Input</label>
    <textarea id="input" placeholder="Paste text or write a prompt..." rows="6"></textarea>

    <div class="controls">
      <button id="run">Run</button>
      <button id="options">Options</button>
      <button id="memory">Page Memory</button>
      <button id="history">History</button>
    </div>

    <div id="resultPanel" class="panel">
      <div id="streamArea" class="stream"></div>
      <div id="result" style="display:none"></div>
      <div id="evidence" style="margin-top:8px"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
